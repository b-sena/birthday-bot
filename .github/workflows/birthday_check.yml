name: 🎂 Verificar Aniversariantes

on:
  schedule:
    # Roda todo dia às 06:00 (horário de Brasília = UTC-3, então 09:00 UTC)
    - cron: "0 6 * * *"

  # Permite rodar manualmente pela aba Actions do GitHub (para testar)
  workflow_dispatch:

jobs:
  check-birthdays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Verificar aniversariantes e notificar
        env:
          EVOLUTION_URL:      ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_APIKEY:   ${{ secrets.EVOLUTION_APIKEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_PHONE:    ${{ secrets.EVOLUTION_PHONE }}
          EVOLUTION_AVISOS: ${{ secrets.EVOLUTION_AVISOS }}
          # EVOLUTION_GROUP:    ${{ secrets.EVOLUTION_GROUP }}
        run: python check_birthdays.py